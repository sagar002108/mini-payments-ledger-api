spring:
  application:
    name: ledger-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

